<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나만의 프로필 카드 만들기</title>
  </head>
  <body>
    <img src="https://picsum.photos/200/200" alt="샘플 이미지" />
    <p>
      <a href="http://www.google.com" target="_blank">내 포트폴리오 가기</a>
    </p>
    <!-- placeholder : 텍스트 입력 창에 회색으로 힌트 -->
    <!-- maxlength : 글자 수 제한 -->
    <input type="text" placeholder="한 줄 소개를 입력하세요." maxlength="10" />

    <!-- disabled : 비활성화 -->
    <button disabled>아직 준비 중</button>
  </body>
</html>

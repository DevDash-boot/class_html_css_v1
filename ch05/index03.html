<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나의 프로필</title>
  </head>
  <body>
    <!-- text-align : 위치 -->
    <!-- border : 테두리 -->
    <!-- max-width : 크기 -->
    <!-- border-radius : 모서리 굴곡 -->
    <div
      style="
        text-align: center;
        border: 2px solid #ddd;
        max-width: 350px;
        border-radius: 15px;
        margin: 50px auto;
      "
    >
      <img
        src="https://picsum.photos/seed/myprofile/150/150"
        alt="프로필 이미지"
        style="border-radius: 50%; border: 3px solid #58a860; margin-top: 20px"
      />
      <h2 style="margin: 15px 0 5px 0">홍길동</h2>
      <p style="color: #888">웹 개발자</p>
      <!-- hr : 선 긋기 -->
      <hr style="margin-left: 20px; margin-right: 20px" />
      <p>부산광역시 부산진구</p>
      <p>HTML/CSS 공부 중</p>
      <p>취미 : 게임, 독서</p>
      <!-- text-decoration : a 사용시 나오는 글자 밑 흰줄 안 보이게 -->
      <!-- margin : 외부 여백 -->
      <!-- padding : 내부 여백 -->
      <!-- border : none - 테두리 없음 -->
      <!-- border : solid - 실선 -->
      <!-- width : 가로 크기 -->
      <!-- cursor : pointer - 버튼에 커서 올리면 변하게  -->
      <a
        href="https://github.com/DevDash-boot"
        target="_blank"
        style="
          background-color: #58a860;
          color: aliceblue;
          display: inline-block;
          text-decoration: none;
          border-radius: 5px;
          border: none;
          width: 150px;
          cursor: pointer;
          margin-bottom: 30px;
          padding: 10px;
        "
        >GitHub 방문하기</a
      >
    </div>
  </body>
</html>
